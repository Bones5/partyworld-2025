{{!-- Celebrate Card: round image and title --}}
<article class="c-celebrateCard">
  <a href="{{url}}" class="c-celebrateCard__media" aria-label="{{title}}">
    {{#if image.url}}
      <img src="{{image.url}}" alt="{{title}}" class="c-celebrateCard__image" />
    {{else if image.data}}
      <img src="{{image.data}}" alt="{{title}}" class="c-celebrateCard__image" />
    {{else if image.source}}
      <img src="{{image.source}}" alt="{{title}}" class="c-celebrateCard__image" />
    {{else if image}}
      <img src="{{cdn image}}" alt="{{title}}" class="c-celebrateCard__image" />
    {{/if}}
  </a>
  <div class="c-celebrateCard__body">
    <h3 class="c-celebrateCard__title">{{title}}</h3>
  </div>
</article>
