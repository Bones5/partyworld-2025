{{!-- Product Confidence Grid: Four delivery/assurance badges --}}
<section class="c-confidenceGrid">
    <div class="c-confidenceGrid__item">
        <div class="c-confidenceGrid__icon">
            <svg aria-hidden="true">
                <use href="#icon-irish-family-business"/>
            </svg>
        </div>
        <span class="c-confidenceGrid__text"><span class="c-confidenceGrid__highlight">Irish</span> Family Business</span>
    </div>
    <div class="c-confidenceGrid__item">
        <div class="c-confidenceGrid__icon">
            <svg aria-hidden="true">
                <use href="#icon-orders-ireland"/>
            </svg>
        </div>
        <span class="c-confidenceGrid__text">{{default ordersIrelandText 'Orders Dispatched From Ireland'}}</span>
    </div>
    <div class="c-confidenceGrid__item">
        <div class="c-confidenceGrid__icon">
            <svg aria-hidden="true">
                <use href="#icon-free-delivery"/>
            </svg>
        </div>
        <span class="c-confidenceGrid__text">{{default deliveryText 'Next Day Delivery & Free Shipping (On Orders over €49)'}}</span>
    </div>
    <div class="c-confidenceGrid__item">
        <div class="c-confidenceGrid__icon">
            <svg aria-hidden="true">
                <use href="#icon-customer-service"/>
            </svg>
        </div>
        <span class="c-confidenceGrid__text">{{default supportText 'Excellent Customer Service'}}</span>
    </div>
</section>
