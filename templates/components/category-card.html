{{!-- Category Card component partial --}}
<article class="c-categoryCard">
  <a href="{{url}}" class="c-categoryCard__media" aria-label="{{title}}">
    <img src="{{image}}" alt="" loading="lazy" />
  </a>
  <div class="c-categoryCard__body">
    <h3 class="c-categoryCard__title">{{title}}</h3>
    <a href="{{url}}" class="c-categoryCard__cta">{{ctaText}}</a>
  </div>
</article>
