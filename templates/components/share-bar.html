{{!-- Share Bar component partial --}}
{{!-- Generic share bar with share, wishlist, and add-to-cart buttons --}}
<div class="c-shareBar" role="group" aria-label="{{lang 'products.share_bar_label' fallback='Share or save this product'}}">
    <a class="c-shareBar__item" href="{{shareUrl}}" target="_blank" rel="noopener" aria-label="{{lang 'products.share' fallback='Share on social'}}">
        <svg class="c-shareBar__icon" aria-hidden="true" focusable="false">
            <use href="#icon-share"></use>
        </svg>
        <span class="c-shareBar__text">{{lang 'products.share' fallback='Share'}}</span>
    </a>
    <button class="c-shareBar__item c-shareBar__item--wishlist" type="button" data-action="add-to-wishlist" aria-label="{{lang 'account.wishlists.add_item' fallback='Add to wishlist'}}">
        <svg class="c-shareBar__icon" aria-hidden="true" focusable="false">
            <use href="#icon-heart"></use>
        </svg>
        <span class="c-shareBar__text">{{lang 'account.wishlists.add_item' fallback='Wishlist'}}</span>
    </button>
    <button class="c-shareBar__item" type="button" data-action="add-to-cart" aria-label="{{lang 'products.add_to_cart' fallback='Add to cart'}}">
        <svg class="c-shareBar__icon" aria-hidden="true" focusable="false">
            <use href="#icon-cart"></use>
        </svg>
        <span class="c-shareBar__text">{{lang 'products.add_to_cart' fallback='Add To Cart'}}</span>
    </button>
</div>
