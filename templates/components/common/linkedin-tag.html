{{!-- 
  LinkedIn Insight Tag
  
  Enables LinkedIn conversion tracking and retargeting.
  Partner ID: 4466482
  
  Can be toggled via Theme Editor setting.
--}}
{{#if theme_settings.show_linkedin_tag}}
<script type="text/javascript" nonce="{{nonce}}">
    (function(l) {
        if (!l) {
            window.lintrk = function(a, b) {
                window.lintrk.q.push([a, b]);
            };
            window.lintrk.q = [];
        }
        var s = document.getElementsByTagName('script')[0];
        var b = document.createElement('script');
        b.type = 'text/javascript';
        b.async = true;
        b.src = 'https://snap.licdn.com/li.lms-analytics/insight.min.js';
        s.parentNode.insertBefore(b, s);
    })(window.lintrk);
</script>
<noscript>
    <img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=4466482&fmt=gif" />
</noscript>
{{/if}}
