<nav aria-label="Breadcrumb">
    <ol class="breadcrumbs">
        {{#unless theme_settings.hide_breadcrumbs }}
            {{#each breadcrumbs}}
                <li class="breadcrumb {{#if @last}}is-active{{/if}}">
                    {{#if @last}}
                        <span class="breadcrumb-label" aria-current="page">{{name}}</span>
                    {{else}}
                        <a class="breadcrumb-label" href="{{url}}">
                            <span>{{name}}</span>
                        </a>
                    {{/if}}
                </li>
            {{/each}}
        {{/unless}}
    </ol>
</nav>

<script type="application/ld+json"  nonce="{{nonce}}">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement":
    [
        {{#each breadcrumbs}}
        {
            "@type": "ListItem",
            "position": {{add @index 1}},
            "item": {
                "@id": {{{JSONstringify url}}},
                "name": {{{JSONstringify name}}}
            }
        }{{#unless @last}},{{/unless}}
        {{/each}}
    ]
}
</script>
