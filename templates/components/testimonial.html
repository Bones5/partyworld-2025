{{!-- Testimonial component partial --}}
<figure class="c-testimonial">
  <div class="c-testimonial__stars" aria-label="{{stars}} out of 5 stars">
    {{#each (range 0 stars)}}
      <svg class="c-icon c-icon--star" aria-hidden="true" focusable="false">
        <use href="#icon-star"></use>
      </svg>
    {{/each}}
  </div>
  <blockquote class="c-testimonial__body">{{body}}</blockquote>
  <figcaption class="c-testimonial__author">{{author}}</figcaption>
</figure>
