name: Unit Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Jest Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Using Node.js 20 to match .nvmrc and pull_request_review.yml
        # Note: playwright.yml uses Node.js 18 for compatibility with Playwright
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm test
      env:
        CI: true
    
    # Note: Coverage upload is conditional as coverage collection is not enabled by default
    # To enable, uncomment 'collectCoverage: true' in jest.config.js
    - name: Upload test coverage
      if: always() && hashFiles('coverage/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage
        path: coverage/
        retention-days: 30
