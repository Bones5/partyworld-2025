name: Acceptance Tests

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Acceptance Tests with Visual Regression
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build theme
        run: npm run build

      - name: Install Stencil CLI
        run: npm install -g @bigcommerce/stencil-cli

      # Note: These tests require a running Stencil server
      # This workflow demonstrates the structure but won't run without proper store setup
      # Uncomment and configure the following steps when you have store credentials
      
      # - name: Start Stencil server
      #   run: |
      #     stencil start &
      #     sleep 10
