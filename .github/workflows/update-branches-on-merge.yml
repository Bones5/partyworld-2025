# Update all branches when PR is merged to master
name: Update Branches on Master Merge

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  update-branches:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all branches and history
          fetch-depth: 0
          # Note: GITHUB_TOKEN has limited permissions. To update protected branches,
          # replace with a PAT: token: ${{ secrets.PAT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch all branches
        run: |
          git fetch --all
          git fetch origin master:master
      
      - name: Update all branches with master
        run: |
          echo "Updating all branches with latest master..."
          
          # Get all remote branches except master using git for-each-ref
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | grep -v '^origin/HEAD$' | grep -v '^origin/master$' | sed 's|^origin/||')
          
          if [ -z "$branches" ]; then
            echo "No branches to update"
            exit 0
          fi
          
          # Track results
          updated=0
          skipped=0
          failed=0
          
          for branch in $branches; do
            echo ""
            echo "Processing branch: $branch"
            
            # Skip if branch doesn't exist remotely anymore
            if ! git ls-remote --heads origin "$branch" | grep -q "$branch"; then
              echo "  ⚠️  Branch $branch no longer exists remotely, skipping"
              skipped=$((skipped + 1))
              continue
            fi
            
            # Checkout the branch
            if ! git checkout "$branch" 2>/dev/null; then
              echo "  ⚠️  Could not checkout $branch, skipping"
              skipped=$((skipped + 1))
              continue
            fi
            
            # Try to merge master into the branch (allow fast-forward)
            if git merge origin/master --no-edit; then
              echo "  ✓ Successfully merged master into $branch"
              
              # Push the updated branch
              if git push origin "$branch"; then
                echo "  ✓ Successfully pushed updated $branch"
                updated=$((updated + 1))
              else
                echo "  ✗ Failed to push $branch"
                failed=$((failed + 1))
              fi
            else
              # Merge conflict - abort and skip
              git merge --abort 2>/dev/null || true
              echo "  ⚠️  Merge conflict detected in $branch, skipping"
              echo "  → Manual merge required for this branch"
              skipped=$((skipped + 1))
            fi
          done
          
          echo ""
          echo "================================"
          echo "Summary:"
          echo "  ✓ Updated: $updated branches"
          echo "  ⚠️  Skipped: $skipped branches (conflicts or issues)"
          echo "  ✗ Failed: $failed branches"
          echo "================================"
      
      - name: Summary
        if: always()
        run: |
          echo "Branch update process completed."
          echo "Check the logs above for details on which branches were updated."
